<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon ASL & Blooming Rose</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08030d;
            --neon-pink: #ff5c9d;
            --neon-purple: #b56eff;
            --neon-blue: #6bcfff;
            --gold: #e6c589;
            --sage: #7d9675;
            
            --glow-pink: 0 0 10px rgba(255, 92, 157, 0.5), 0 0 20px rgba(255, 92, 157, 0.3);
            --glow-purple: 0 0 10px rgba(181, 110, 255, 0.5), 0 0 20px rgba(181, 110, 255, 0.3);
            --glow-blue: 0 0 10px rgba(107, 207, 255, 0.5), 0 0 20px rgba(107, 207, 255, 0.3);
            --glow-gold: 0 0 10px rgba(230, 197, 137, 0.5), 0 0 20px rgba(230, 197, 137, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Prevent scroll on touch devices */
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Work Sans', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: absolute;
            width: 60vmin;
            height: 60vmin;
            background: radial-gradient(circle, rgba(181,110,255,0.15) 0%, rgba(8,3,13,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            transition: left 0.1s ease-out, top 0.1s ease-out;
            mix-blend-mode: screen;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .header-text {
            text-align: center;
            opacity: 0;
            transform: translateY(-20px);
            animation: fadeInDown 2s ease forwards 0.5s;
            position: absolute;
            top: 10%;
        }

        .eyebrow {
            font-family: 'Work Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            font-size: clamp(0.7rem, 2vw, 0.9rem);
            color: var(--neon-blue);
            margin-bottom: 0.5rem;
            text-shadow: var(--glow-blue);
        }

        .name {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--neon-pink);
            text-shadow: var(--glow-pink);
            line-height: 1;
        }

        .stage {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15vh;
        }

        .svg-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }

        svg {
            width: 80%;
            height: 80%;
            overflow: visible;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.1));
        }

        /* Shared SVG Path Styles */
        .hand-path {
            fill: var(--bg-color); /* Occlusion */
            stroke: var(--neon-purple);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px var(--neon-purple));
            opacity: 0;
        }

        /* Hand Animation Class */
        .draw-hand {
            animation: dashDraw 1.2s ease-in-out forwards, glowPulse 2s infinite alternate;
        }

        /* Rose specific styles */
        .rose-stem {
            fill: none;
            stroke: var(--sage);
            stroke-width: 4;
            stroke-linecap: round;
            opacity: 0;
        }
        .rose-leaf {
            fill: var(--bg-color);
            stroke: var(--sage);
            stroke-width: 3;
            opacity: 0;
        }
        .rose-petal-back {
            fill: var(--bg-color);
            stroke: var(--neon-purple);
            stroke-width: 2.5;
            opacity: 0;
        }
        .rose-petal-core {
            fill: var(--bg-color);
            stroke: var(--neon-pink);
            stroke-width: 3;
            opacity: 0;
            filter: drop-shadow(0 0 8px var(--neon-pink));
        }
        
        .rose-petal-front {
             fill: var(--bg-color);
            stroke: var(--neon-pink);
            stroke-width: 2;
            opacity: 0;
        }


        .footer-text {
            text-align: center;
            position: absolute;
            bottom: 15%;
            opacity: 0;
        }

        .subtitle {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: var(--gold);
            text-shadow: var(--glow-gold);
            letter-spacing: 0.1em;
        }

        .replay-btn {
            position: absolute;
            bottom: 5%;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            color: white;
            font-family: 'Work Sans', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .replay-btn:hover, .replay-btn:active {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(107, 207, 255, 0.4);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes dashDraw {
            from {
                stroke-dasharray: 1000;
                stroke-dashoffset: 1000;
                opacity: 1;
            }
            to {
                stroke-dasharray: 1000;
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }
        
        @keyframes roseDraw {
            from {
                stroke-dasharray: 500;
                stroke-dashoffset: 500;
                opacity: 1;
            }
            to {
                stroke-dasharray: 500;
                stroke-dashoffset: 0;
                opacity: 1;
            }
        }

        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 5px var(--neon-purple)); }
            100% { filter: drop-shadow(0 0 15px var(--neon-purple)); }
        }
        
        @keyframes fillIn {
            0% { fill: var(--bg-color); }
            100% { fill: rgba(255, 92, 157, 0.1); } /* slight tint for petals */
        }
        
        @keyframes fillInLeaf {
            0% { fill: var(--bg-color); }
            100% { fill: rgba(125, 150, 117, 0.1); }
        }


        .fade-out {
            opacity: 0 !important;
        }
        .fade-in {
            animation: fadeInUp 1.5s ease forwards;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="ambient-glow" id="ambientGlow"></div>

    <div class="container">
        <div class="header-text">
            <div class="eyebrow">for</div>
            <div class="name">Aya</div>
        </div>

        <div class="stage">
            <!-- ASL Container -->
            <div class="svg-wrapper" id="aslWrapper">
                <svg id="aslSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Paths will be injected here via JS -->
                </svg>
            </div>

            <!-- Rose Container -->
            <div class="svg-wrapper" id="roseWrapper" style="opacity: 0; pointer-events: none;">
                <svg id="roseSvg" viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
                    <!-- Stem -->
                    <path class="rose-stem" d="M100,220 C90,180 110,130 100,90" />
                    
                    <!-- Leaves -->
                    <path class="rose-leaf" d="M105,160 C120,150 140,155 145,170 C130,180 115,175 105,160 Z" />
                    <path class="rose-leaf" d="M95,140 C80,130 60,135 55,150 C70,160 85,155 95,140 Z" />
                    
                    <!-- Back Petals -->
                    <path class="rose-petal-back" d="M70,70 C70,40 100,30 100,60 C100,30 130,40 130,70 C130,100 100,100 100,100 C100,100 70,100 70,70 Z" />
                    <path class="rose-petal-back" d="M60,85 C50,60 70,45 85,60 C80,80 75,95 100,105 C75,105 65,100 60,85 Z" />
                    <path class="rose-petal-back" d="M140,85 C150,60 130,45 115,60 C120,80 125,95 100,105 C125,105 135,100 140,85 Z" />

                    <!-- Core/Front Petals -->
                    <path class="rose-petal-core" d="M80,80 C80,55 100,50 100,75 C100,50 120,55 120,80 C120,100 100,105 100,105 C100,105 80,100 80,80 Z" />
                    <path class="rose-petal-front" d="M85,85 C90,70 100,70 100,85 C100,95 95,100 100,100 C90,100 85,95 85,85 Z" />
                    <path class="rose-petal-front" d="M115,85 C110,70 100,70 100,85 C100,95 105,100 100,100 C110,100 115,95 115,85 Z" />
                    
                    <!-- Center swril -->
                    <path class="rose-petal-core" d="M95,85 C100,80 105,85 100,90 C95,85 100,80 95,85" style="fill:none; stroke-width:2;"/>
                </svg>
            </div>
        </div>

        <div class="footer-text" id="footerText">
            <div class="subtitle">Do not give up</div>
        </div>

        <button class="replay-btn" id="replayBtn">Tap to bloom again</button>
    </div>

    <script>
        // --- Particle System ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        const ambientGlow = document.getElementById('ambientGlow');
        
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, active: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        const colors = ['#ff5c9d', '#b56eff', '#6bcfff', '#e6c589'];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height + height; // Start below screen
                this.size = Math.random() * 2 + 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.speedY = Math.random() * -0.5 - 0.1;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.baseOpacity = Math.random() * 0.5 + 0.1;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.02;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.angle) * 0.2;
                this.angle += this.spin;

                if (mouse.active) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const forceDirectionX = dx / distance;
                    const forceDirectionY = dy / distance;
                    const maxDistance = 150;
                    
                    if (distance < maxDistance) {
                        const force = (maxDistance - distance) / maxDistance;
                        this.x -= forceDirectionX * force * 2;
                        this.y -= forceDirectionY * force * 2;
                    }
                }

                if (this.y < -10) {
                    this.y = height + 10;
                    this.x = Math.random() * width;
                }

                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.baseOpacity + (Math.sin(this.angle) * 0.2); 
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; 
            }
        }

        function initParticles() {
            particles = [];
            let numParticles = (width * height) / 10000; 
            numParticles = Math.min(numParticles, 150); 
            for (let i = 0; i < numParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);

            ctx.fillStyle = 'rgba(8, 3, 13, 0.2)'; 
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        function updateInteraction(x, y) {
            mouse.x = x;
            mouse.y = y;
            mouse.active = true;
            ambientGlow.style.left = `${x}px`;
            ambientGlow.style.top = `${y}px`;
        }

        window.addEventListener('mousemove', (e) => {
            updateInteraction(e.clientX, e.clientY);
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                updateInteraction(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        window.addEventListener('mouseleave', () => mouse.active = false);
        window.addEventListener('touchend', () => mouse.active = false);


        const aslDictionary = {
            'I': `M100,180 C80,180 70,160 70,140 C70,130 75,120 75,120 
                  L60,110 C50,105 50,90 60,85 C70,80 80,90 85,100
                  L85,110 L90,110 L90,80 C90,70 105,70 105,80 L105,110
                  L110,110 L110,85 C110,75 125,75 125,85 L125,110
                  L130,110 L130,90 C130,80 145,80 145,90 L145,120
                  L150,115 C160,105 170,115 160,125 L135,150 
                  C130,170 120,180 100,180 Z
                  M130,110 L130,30 C130,20 145,20 145,30 L145,90`, // Pinky up, fist
            'L': `M100,180 C80,180 70,160 70,140 L70,120 L75,120
                  C75,100 65,90 50,90 C30,90 30,105 50,110 L70,125
                  L70,30 C70,15 90,15 90,30 L90,110
                  L100,110 L100,80 C100,70 115,70 115,80 L115,110
                  L120,110 L120,85 C120,75 135,75 135,85 L135,110
                  L140,110 L140,90 C140,80 155,80 155,90 L155,130
                  C150,160 130,180 100,180 Z`, // Index up, thumb out
            'O': `M100,180 C70,180 60,150 60,130 C60,110 50,100 45,90 C40,80 50,70 60,75 C70,80 80,95 85,110
                  C90,90 85,60 90,50 C100,30 130,40 135,60 C140,80 130,110 125,110
                  C140,100 150,90 160,100 C170,110 165,125 150,135
                  C140,160 120,180 100,180 Z
                  M85,110 C90,105 100,105 105,110 C100,115 90,115 85,110`, // Circle with fingers and thumb
            'V': `M100,180 C80,180 70,160 70,140 L70,120 L75,120
                  L60,110 C50,105 50,90 60,85 C70,80 80,90 85,100 L85,110
                  L85,30 C85,15 100,15 100,30 L100,110
                  L105,110 L115,30 C120,15 135,20 130,35 L120,110
                  L125,110 L125,90 C125,80 140,80 140,90 L140,110
                  L145,110 L145,95 C145,85 160,85 160,95 L160,130
                  C150,160 130,180 100,180 Z`, // Index and middle up, apart
            'E': `M100,180 C80,180 70,160 70,140 C70,120 70,100 65,90 C60,80 70,70 80,75 C90,80 95,100 95,110
                  L95,110 L95,100 C95,90 110,90 110,100 L110,115
                  L110,115 L110,105 C110,95 125,95 125,105 L125,120
                  L125,120 L125,110 C125,100 140,100 140,110 L140,125
                  L140,125 L140,115 C140,105 155,105 155,115 L155,140
                  C145,170 120,180 100,180 Z
                  M95,115 C110,115 125,115 140,115`, 
            'Y': `M100,180 C80,180 70,160 70,140 C70,130 65,110 50,105 C30,100 30,115 50,120 L75,130
                  L80,130 L80,90 C80,80 95,80 95,90 L95,110
                  L100,110 L100,85 C100,75 115,75 115,85 L115,110
                  L120,110 L120,90 C120,80 135,80 135,90 L135,110
                  L140,110 L140,40 C140,25 155,25 155,40 L150,130
                  C140,160 120,180 100,180 Z`,
            'U': `M100,180 C80,180 70,160 70,140 L70,120 L75,120
                  L60,110 C50,105 50,90 60,85 C70,80 80,90 85,100 L85,110
                  L90,110 L90,30 C90,15 105,15 105,30 L105,110
                  L110,110 L110,30 C110,15 125,15 125,30 L125,110
                  L130,110 L130,90 C130,80 145,80 145,90 L145,110
                  L150,110 L150,95 C150,85 165,85 165,95 L165,130
                  C150,160 130,180 100,180 Z` 
        };

        const sequence = ['I', 'L', 'O', 'V', 'E', 'Y', 'O', 'U'];
        const aslSvg = document.getElementById('aslSvg');
        const aslWrapper = document.getElementById('aslWrapper');
        const roseWrapper = document.getElementById('roseWrapper');
        const footerText = document.getElementById('footerText');
        const replayBtn = document.getElementById('replayBtn');
        let currentSequenceIndex = 0;
        let isPlaying = false;

        function drawHandShape(letter) {
            aslSvg.innerHTML = ''; 
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', aslDictionary[letter]);
            path.setAttribute('class', 'hand-path draw-hand');
            
            const colors = ['var(--neon-pink)', 'var(--neon-purple)', 'var(--neon-blue)'];
            path.style.stroke = colors[currentSequenceIndex % colors.length];
            
            aslSvg.appendChild(path);
        }

        async function playSequence() {
            if (isPlaying) return;
            isPlaying = true;

            aslWrapper.classList.remove('fade-out');
            roseWrapper.classList.add('fade-out');
            roseWrapper.style.opacity = 0;
            footerText.classList.remove('fade-in');
            footerText.style.opacity = 0;
            replayBtn.style.opacity = 0;
            replayBtn.style.pointerEvents = 'none';
            replayBtn.style.transform = 'translateY(20px)';

            const rosePaths = document.querySelectorAll('#roseSvg path');
            rosePaths.forEach(p => {
                p.style.animation = 'none';
                p.style.opacity = 0;
            });

            await new Promise(r => setTimeout(r, 1000));

            for (let i = 0; i < sequence.length; i++) {
                currentSequenceIndex = i;
                drawHandShape(sequence[i]);

                await new Promise(r => setTimeout(r, 1600)); 
            }

            triggerFinale();
        }

        function triggerFinale() {

            aslWrapper.classList.add('fade-out');
            
            setTimeout(() => {
   
                roseWrapper.classList.remove('fade-out');
                roseWrapper.style.opacity = 1;
                
                animateRose();
                
            }, 1000);
        }

        function animateRose() {
            const stem = document.querySelector('.rose-stem');
            const leaves = document.querySelectorAll('.rose-leaf');
            const backPetals = document.querySelectorAll('.rose-petal-back');
            const corePetals = document.querySelectorAll('.rose-petal-core');
            const frontPetals = document.querySelectorAll('.rose-petal-front');


            stem.style.animation = 'roseDraw 1.5s ease-in-out forwards';
            
            setTimeout(() => {

                leaves.forEach((leaf, index) => {
                    leaf.style.animation = `roseDraw 1s ease-out forwards ${index * 0.3}s, fillInLeaf 1s ease forwards ${1 + index*0.3}s`;
                });
            }, 1000);

            setTimeout(() => {

                let delay = 0;
                
                backPetals.forEach(petal => {
                    petal.style.animation = `roseDraw 1s ease-out forwards ${delay}s, fillIn 1s ease forwards ${delay + 0.5}s`;
                    delay += 0.3;
                });

                corePetals.forEach(petal => {
                    petal.style.animation = `roseDraw 1s ease-out forwards ${delay}s, fillIn 1s ease forwards ${delay + 0.5}s`;
                    delay += 0.2;
                });

                frontPetals.forEach(petal => {
                    petal.style.animation = `roseDraw 0.8s ease-out forwards ${delay}s, fillIn 0.8s ease forwards ${delay + 0.4}s`;
                    delay += 0.2;
                });

                setTimeout(() => {
                    footerText.classList.add('fade-in');
                }, delay * 1000 + 500);

                setTimeout(() => {
                    replayBtn.style.opacity = 1;
                    replayBtn.style.pointerEvents = 'auto';
                    replayBtn.style.transform = 'translateY(0)';
                    isPlaying = false;
                }, delay * 1000 + 2000);

            }, 2000);
        }

        replayBtn.addEventListener('click', () => {
            playSequence();
        });

        window.onload = () => {
            initParticles();
            animateParticles();
            
            setTimeout(playSequence, 1500);
        };

    </script>
</body>
</html>
